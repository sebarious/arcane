; Raises PHP's own upload ceiling above what a normal phone photo needs.
; Without this, PHP silently drops any upload over upload_max_filesize
; before Laravel/LogoProcessor ever sees it — no amount of server-side
; validation or image compression can rescue a file PHP has already
; rejected at this layer. Only takes effect under PHP-FPM (CGI/FastCGI
; SAPIs); `php artisan serve`/CLI ignore .user.ini entirely.
upload_max_filesize = 10M
post_max_size = 12M

; GD needs real headroom to decode+resize a large source photo (a 4000x3000
; image alone needs ~48MB just for one in-memory bitmap) — LogoProcessor
; hit the default 128M ceiling on a photo this size in testing.
memory_limit = 256M
